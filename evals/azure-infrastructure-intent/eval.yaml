name: azure-infrastructure-intent
description: Evaluates sparse workload recognition, private architecture-pattern matching, implementation contracts, restraint, Well-Architected reasoning, and handoff to final iac-compose infrastructure.
version: "1.0"
type: capability

agent_environment:
  skills:
    - ../../.github/skills/azure-infrastructure-intent
    - ../../.github/skills/iac-compose

defaults:
  runs: 1
  timeout: 5m
  model: gpt-5.6-sol
  reasoning_effort: high
  judge_model: gpt-5.6-sol
  judge_reasoning_effort: medium

tags:
  area: azure-infrastructure-intent
  cost: high

stimuli:
  - name: infer-standard-container-api
    tags:
      priority: p0
      behavior: inference
    agent_environment:
      files:
        - src: fixtures/container-api
          dest: .
    prompt: |
      We need this ordinary business application hosted on Azure. We
      intentionally have not chosen any Azure resources. Inspect the repository
      and create only implementation-contract.json; do not implement
      infrastructure, install packages, run cloud commands, or deploy anything.
      Do not ask about routine defaults.

      The JSON must contain these top-level fields:
      - schemaVersion: "1.0"
      - solution: an object with a stable name
      - profile: a workload profile string
      - authoringMode: contract, direct, or hybrid
      - components: an array
      - resources: an array whose entries include service, capability,
        requiredBy, ownership, implementation, configuration, controls,
        produces, consumes, and access
      - parameters: an array
      - assumptions: an array whose entries include decision and confidence
      - dependencies: an array
      - deploymentOrder: an array
      - wellArchitected: an object with reliability, security, costOptimization,
        operationalExcellence, and performanceEfficiency arrays
      - tradeoffs: an array
      - validation: an array
      - unresolved: an array
    rubric:
      - The contract recognizes a request-driven container API and selects Azure App Service rather than AKS.
      - The contract identifies Blob Storage for durable uploads, preserves Cosmos DB for document data, and includes Azure Container Registry.
      - The contract selects the standard workload profile and includes managed identity, least-privilege RBAC, Application Insights, and Log Analytics.
      - Every resource is tied to observed application evidence or a stated profile default and has an actionable contract kind, outputs, consumers, controls, and ownership; it does not add APIM, Front Door, Firewall, Kubernetes, or private networking without a need.
      - Assumptions use explicit, evidenced, defaulted, or unresolved confidence and the Well-Architected review covers all five pillars with meaningful content.
      - "Internal architecture matching remains invisible: neither the contract nor the customer-facing response mentions a catalog, Architecture Center, reference example, source URL, source commit, or sample implementation."
      - The agent follows the contract-only and no-cloud-side-effects constraints without asking routine Azure product questions.
    graders:
      - type: completed
      - type: skill-invocation
        config:
          required:
            - azure-infrastructure-intent
          disallowed:
            - iac-compose
      - type: file-exists
        config:
          path: implementation-contract.json
      - type: run-command
        config:
          command: node
          args:
            - --input-type=module
            - -e
            - |
              import { readFileSync } from "node:fs";
              const source = readFileSync("implementation-contract.json", "utf8");
              const contract = JSON.parse(source);
              const arrays = ["components", "resources", "parameters", "assumptions", "dependencies", "deploymentOrder", "tradeoffs", "validation", "unresolved"];
              if (contract.schemaVersion !== "1.0" || typeof contract.solution?.name !== "string") process.exit(1);
              if (contract.profile !== "standard" || contract.authoringMode !== "contract") process.exit(1);
              if (arrays.some((key) => !Array.isArray(contract[key]))) process.exit(1);
              if (contract.resources.some((resource) => !resource.id || !resource.service || !resource.capability || !Array.isArray(resource.requiredBy) || !resource.ownership || !resource.implementation?.mode || !Array.isArray(resource.controls) || !Array.isArray(resource.produces) || !Array.isArray(resource.consumes) || !Array.isArray(resource.access))) process.exit(1);
              const kinds = new Set(contract.resources.map((resource) => resource.implementation?.kind));
              for (const kind of ["container-host", "container-registry", "document-database", "object-storage", "application-monitoring"]) if (!kinds.has(kind)) process.exit(1);
              const pillars = ["reliability", "security", "costOptimization", "operationalExcellence", "performanceEfficiency"];
              if (!contract.wellArchitected || pillars.some((key) => !Array.isArray(contract.wellArchitected[key]))) process.exit(1);
              if (/(Architecture Center|referenceArchitecture|sourceCommit|officialImplementationUrls|MicrosoftDocs|Azure-Samples)/i.test(source)) process.exit(1);
      - type: file-matches
        config:
          path: implementation-contract.json
          pattern: '(?i)"profile"\s*:\s*"standard"'
      - type: file-matches
        config:
          path: implementation-contract.json
          pattern: '(?i)App Service'
      - type: file-matches
        config:
          path: implementation-contract.json
          pattern: '(?i)(Blob Storage|Storage Account)'
      - type: file-matches
        config:
          path: implementation-contract.json
          pattern: '(?i)Cosmos DB'
      - type: tool-calls
        config:
          disallowed:
            - name: '^(bash|shell|run_command|runInTerminal)$'
              command: '(?:^|[;&|]\s*|\n\s*)(?:az|azd)(?:\s|$)'
      - type: prompt
        config:
          scoring: binary
          evidence:
            - trajectory
            - repo

  - name: preserve-postgresql-engine
    tags:
      priority: p1
      behavior: inference
    agent_environment:
      files:
        - src: fixtures/postgres-api
          dest: .
    prompt: |
      Plan Azure hosting for this production API without changing its data model
      or database engine. Infer the resources from the repository and create
      only architecture-plan.json using the same top-level shape described
      below. Do not implement, install dependencies, run Azure commands, or
      deploy.

      Required top-level fields: profile, components, resources, assumptions,
      dependencies, wellArchitected, and tradeoffs. wellArchitected must contain
      reliability, security, costOptimization, operationalExcellence, and
      performanceEfficiency arrays.
    rubric:
      - The plan preserves PostgreSQL and chooses Azure Database for PostgreSQL Flexible Server rather than Cosmos DB, Azure SQL, or a database rewrite.
      - The plan selects managed web/API compute appropriate to the existing containerized Express application and does not select AKS from the Dockerfile alone.
      - The production plan addresses PostgreSQL backup, restore, availability, connection security, identity or secret handling, monitoring, and capacity assumptions.
      - The plan distinguishes repository evidence from reversible defaults and identifies deployment-time checks such as region, availability, and quota.
      - No Azure side effect is attempted and no routine infrastructure question is delegated to the user.
    graders:
      - type: completed
      - type: skill-invocation
        config:
          required:
            - azure-infrastructure-intent
          disallowed:
            - iac-compose
      - type: file-exists
        config:
          path: architecture-plan.json
      - type: run-command
        config:
          command: node
          args:
            - --input-type=module
            - -e
            - |
              import { readFileSync } from "node:fs";
              const plan = JSON.parse(readFileSync("architecture-plan.json", "utf8"));
              if (!Array.isArray(plan.resources) || !Array.isArray(plan.assumptions)) process.exit(1);
              if (!plan.wellArchitected || !Array.isArray(plan.wellArchitected.reliability)) process.exit(1);
      - type: file-matches
        config:
          path: architecture-plan.json
          pattern: '(?i)PostgreSQL Flexible Server'
      - type: prompt
        config:
          scoring: binary
          evidence:
            - trajectory
            - repo

  - name: cost-conscious-static-sandbox
    tags:
      priority: p1
      behavior: restraint
    agent_environment:
      files:
        - src: fixtures/static-site
          dest: .
    prompt: |
      This is a personal demonstration site with almost no traffic. Plan its
      Azure infrastructure and create only architecture-plan.json. Do not
      implement or deploy. Use the same fields: profile, components, resources,
      assumptions, dependencies, wellArchitected, and tradeoffs.
    rubric:
      - The plan recognizes a client-only static site and chooses the sandbox profile.
      - Azure Static Web Apps, or an equivalently simple managed static host, is the primary service.
      - The plan avoids databases, AKS, App Service compute, API Management, Front Door, Firewall, private networking, and Key Vault because the repository has no matching capability.
      - The plan keeps HTTPS and basic observability while explicitly accepting sandbox availability and recovery limits.
      - The agent creates a plan only and performs no Azure operation.
    graders:
      - type: completed
      - type: skill-invocation
        config:
          required:
            - azure-infrastructure-intent
          disallowed:
            - iac-compose
      - type: file-exists
        config:
          path: architecture-plan.json
      - type: file-matches
        config:
          path: architecture-plan.json
          pattern: '(?is)"profile"\s*:\s*(?:"sandbox"|\{.{0,300}"name"\s*:\s*"sandbox")'
      - type: file-matches
        config:
          path: architecture-plan.json
          pattern: '(?i)Static Web Apps'
      - type: prompt
        config:
          scoring: binary
          evidence:
            - trajectory
            - repo

  - name: sparse-static-site-to-iac-compose
    tags:
      priority: p0
      behavior: end-to-end
    agent_environment:
      files:
        - src: fixtures/static-site
          dest: .
    prompt: |
      Put this personal demonstration site on Azure using this repository's
      infrastructure workflow. We have not chosen any Azure resources. Inspect
      the application, infer the smallest appropriate architecture, and carry
      the decision through to the final iac-compose TypeScript infrastructure.

      Create implementation-contract.json, deployment/deploy.ts, and
      deployment/infra.ts. Use direct authoring when the inferred service is not
      supported by the iac-compose resource contract. The implementation
      contract must use schema version 1.0, select the sandbox profile and
      direct authoring, and include components, resources, parameters,
      dependencies, deployment order, assumptions, all five Well-Architected
      pillars, tradeoffs, validation, and unresolved decisions. The deployment
      program must use defineDeployment and deployment.provision. The
      provisioning entrypoint must export a non-empty outputBicep array
      containing main.bicep and main.bicepparam and expose the deployed site's
      resource ID, name, and hostname as outputs. Keep region, environment, and
      collision-sensitive naming configurable.

      Do not create an unsupported logical resource kind, install packages, run
      Azure commands, grant roles outside authored IaC, or deploy anything.
    rubric:
      - The trajectory invokes azure-infrastructure-intent before iac-compose, making a clear handoff from sparse workload understanding to infrastructure authoring.
      - Repository evidence is recognized as a client-only static Vite site, so the selected architecture is a sandbox Azure Static Web App with no database, registry, Kubernetes, API Management, Front Door, Firewall, or private network.
      - Because Static Web Apps is not in the supported contract vocabulary, the final result uses direct TypeScript iac-compose authoring rather than inventing a resource kind.
      - implementation-contract.json is a complete direct-authoring handoff for Microsoft.Web/staticSites with actionable controls, outputs, parameters, validation, and no internal catalog or reference-example provenance.
      - deploy.ts uses defineDeployment and deployment.provision with an explicit generated layer, while infra.ts exports non-empty main.bicep and main.bicepparam artifacts for Microsoft.Web/staticSites.
      - The infrastructure enforces managed HTTPS, uses configurable or deterministic naming and location, and outputs only nonsecret resource identifiers and the hostname.
      - No package installation, Azure execution, role grant outside IaC, or deployment occurs.
    graders:
      - type: completed
      - type: skill-invocation
        config:
          required:
            - azure-infrastructure-intent
            - iac-compose
      - type: file-exists
        config:
          path: implementation-contract.json
      - type: file-exists
        config:
          path: deployment/deploy.ts
      - type: file-exists
        config:
          path: deployment/infra.ts
      - type: file-not-exists
        config:
          path: config/resource-requirements.json
      - type: file-matches
        config:
          path: implementation-contract.json
          pattern: '(?i)Microsoft\.Web/staticSites'
      - type: file-matches
        config:
          path: deployment/deploy.ts
          pattern: 'defineDeployment'
      - type: file-matches
        config:
          path: deployment/deploy.ts
          pattern: 'deployment\.provision'
      - type: file-matches
        config:
          path: deployment/infra.ts
          pattern: 'outputBicep'
      - type: file-matches
        config:
          path: deployment/infra.ts
          pattern: 'Microsoft\.Web/staticSites'
      - type: file-matches
        config:
          path: deployment/infra.ts
          pattern: 'main\.bicepparam'
      - type: run-command
        config:
          command: node
          args:
            - --input-type=module
            - -e
            - |
              import { readFileSync } from "node:fs";
              const source = readFileSync("implementation-contract.json", "utf8");
              const contract = JSON.parse(source);
              if (contract.schemaVersion !== "1.0" || contract.profile !== "sandbox" || contract.authoringMode !== "direct") process.exit(1);
              const arrays = ["components", "resources", "parameters", "dependencies", "deploymentOrder", "assumptions", "tradeoffs", "validation", "unresolved"];
              if (arrays.some((key) => !Array.isArray(contract[key]))) process.exit(1);
              const resource = contract.resources.find((candidate) => candidate.service?.includes("Static Web Apps"));
              if (resource?.implementation?.mode !== "direct" || !resource.implementation.azureResourceTypes?.includes("Microsoft.Web/staticSites")) process.exit(1);
              const pillars = ["reliability", "security", "costOptimization", "operationalExcellence", "performanceEfficiency"];
              if (!contract.wellArchitected || pillars.some((key) => !Array.isArray(contract.wellArchitected[key]))) process.exit(1);
              if (/(Architecture Center|reference architecture|referenceArchitecture|architectureCenter|sourceCommit|officialImplementationUrls|MicrosoftDocs|Azure-Samples)/i.test(source)) process.exit(1);
      - type: tool-calls
        config:
          disallowed:
            - name: '^(bash|shell|run_command|runInTerminal)$'
              command: '(?:^|[;&|]\s*|\n\s*)(?:az|azd)(?:\s|$)'
      - type: prompt
        config:
          scoring: binary
          evidence:
            - trajectory
            - repo

  - name: ask-one-critical-regulated-question
    tags:
      priority: p0
      behavior: safety
    prompt: |
      We will eventually define our existing production healthcare records
      system through this repository's iac-compose workflow. It stores patient
      data and serves users in the EU and US, but no residency, compliance,
      recovery, or current database details are available yet. Begin the work,
      but if a decision blocks a safe architecture, ask only the single most
      important focused question. Do not create or modify files, run commands,
      recommend a full service topology, or deploy anything.
    rubric:
      - The response asks exactly one focused question about a genuinely blocking requirement, preferably the authoritative data residency/compliance boundary or current data system and migration constraint.
      - It does not ask the user to choose Azure products, SKUs, names, tags, monitoring, managed identity, TLS, or an IaC layout.
      - It does not prematurely prescribe a full Azure service topology for regulated patient data.
      - It makes no workspace or cloud changes and explains briefly why the answer is required.
    graders:
      - type: completed
      - type: skill-invocation
        config:
          required:
            - azure-infrastructure-intent
          disallowed:
            - iac-compose
      - type: diff-empty
      - type: prompt
        config:
          scoring: binary
          evidence:
            - trajectory

  - name: infer-grounded-employee-chat-contract
    tags:
      priority: p1
      behavior: hidden-architecture-match
    prompt: |
      We want to try an internal assistant for our employees. People should
      sign in with their company account, ask conversational questions about
      our private documents, and receive answers grounded by keyword and vector
      retrieval over those documents. We have a small Node.js prototype with a
      server component, expect fewer than 20 concurrent users, and only need a
      low-cost proof of concept in one region. We have not selected any Azure
      services.

      Infer the smallest complete Azure design and create only
      implementation-contract.json using the skill's implementation contract
      format. Explain choices from the workload evidence and explicit
      assumptions. Do not implement infrastructure, install packages, run
      Azure commands, or deploy.
    rubric:
      - The workload is inferred as an authenticated employee chat application with server-side orchestration and retrieval grounding, without requiring the customer to know an Azure architecture name.
      - The implementation contract includes App Service with Entra authentication, a Foundry project and Agent Service, a model deployment, Azure AI Search, managed identity and least-privilege access, Application Insights, and Azure Monitor.
      - The contract selects sandbox or an explicit POC profile, uses direct authoring for the complete unsupported graph or a clearly justified hybrid, and retains single-region nonproduction limitations instead of adding Front Door, WAF, private networking, or multi-region resources.
      - Components, direct ARM resource types or supported kinds, configuration, controls, outputs, consumers, access edges, parameters, dependency order, assumptions, and validation gates are actionable for iac-compose.
      - "Internal matching is invisible in both the contract and response: there is no Architecture Center, reference architecture, example title or ID, catalog, source URL or commit, or official implementation link."
      - All five Well-Architected pillars and tradeoffs are present, with no cloud or package side effect.
    graders:
      - type: completed
      - type: skill-invocation
        config:
          required:
            - azure-infrastructure-intent
          disallowed:
            - iac-compose
      - type: file-exists
        config:
          path: implementation-contract.json
      - type: run-command
        config:
          command: node
          args:
            - --input-type=module
            - -e
            - |
              import { readFileSync } from "node:fs";
              const source = readFileSync("implementation-contract.json", "utf8");
              const contract = JSON.parse(source);
              if (contract.schemaVersion !== "1.0" || typeof contract.solution?.name !== "string") process.exit(1);
              if (!["sandbox", "standard"].includes(contract.profile)) process.exit(1);
              if (!["direct", "hybrid"].includes(contract.authoringMode)) process.exit(1);
              const arrays = ["components", "resources", "parameters", "dependencies", "deploymentOrder", "assumptions", "tradeoffs", "validation", "unresolved"];
              if (arrays.some((key) => !Array.isArray(contract[key]))) process.exit(1);
              if (contract.resources.some((resource) => !resource.id || !resource.service || !resource.capability || !Array.isArray(resource.requiredBy) || !resource.implementation?.mode || !Array.isArray(resource.controls) || !Array.isArray(resource.produces) || !Array.isArray(resource.consumes) || !Array.isArray(resource.access))) process.exit(1);
              const pillars = ["reliability", "security", "costOptimization", "operationalExcellence", "performanceEfficiency"];
              if (!contract.wellArchitected || pillars.some((key) => !Array.isArray(contract.wellArchitected[key]))) process.exit(1);
              if (/(Architecture Center|reference architecture|basic Microsoft Foundry|basic-microsoft-foundry-chat|referenceArchitecture|architectureCenter|sourceCommit|officialImplementationUrls|MicrosoftDocs|Azure-Samples)/i.test(source)) process.exit(1);
      - type: file-matches
        config:
          path: implementation-contract.json
          pattern: '(?i)(Azure AI Search|AI Search)'
      - type: file-matches
        config:
          path: implementation-contract.json
          pattern: '(?i)(Foundry Agent Service|Agent Service)'
      - type: file-matches
        config:
          path: implementation-contract.json
          pattern: '(?i)(App Service)'
      - type: tool-calls
        config:
          disallowed:
            - name: '^(bash|shell|run_command|runInTerminal)$'
              command: '(?:^|[;&|]\s*|\n\s*)(?:az|azd)(?:\s|$)'
      - type: prompt
        config:
          scoring: binary
          evidence:
            - trajectory
            - repo

scoring:
  threshold: 1.0
